name: Patch Electron mirror fallback

on:
  push:
    branches:
      - feat/multica-local-process-executor
    paths:
      - .github/workflows/patch-electron-mirror-fallback.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/multica-local-process-executor
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply exact-context patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f'{label} context count={text.count(old)}')
              return text.replace(old, new, 1)

          installer_path = Path('config/scripts/install-electron-package-binary.mjs')
          installer = installer_path.read_text(encoding='utf-8')
          installer = replace_once(
              installer,
              'const MAX_RETRY_DELAY_MS = 5 * 60 * 1000\n',
              'const MAX_RETRY_DELAY_MS = 5 * 60 * 1000\nconst MAX_FALLBACK_MIRROR_LENGTH = 2048\n',
              'retry constant',
          )

          retry_marker = (
              '  const retryDelays = parseElectronDownloadRetryDelays(\n'
              '    process.env.ORCA_ELECTRON_PACKAGE_RETRY_DELAYS_MS\n'
              '  )\n'
          )
          installer = replace_once(
              installer,
              retry_marker,
              retry_marker
              + '  const fallbackMirrorOptions = parseElectronFallbackMirror(\n'
              + '    process.env.ORCA_ELECTRON_PACKAGE_FALLBACK_MIRROR\n'
              + '  )\n',
              'retry setup',
          )

          attempt_marker = (
              '    const attemptDirectory = mkdtempSync(join(tempRoot, `attempt-${attempt + 1}-`))\n'
              '    const downloadOptions = {\n'
          )
          installer = replace_once(
              installer,
              attempt_marker,
              '    const attemptDirectory = mkdtempSync(join(tempRoot, `attempt-${attempt + 1}-`))\n'
              + '    const mirrorOptions = getAttemptMirrorOptions(attempt, fallbackMirrorOptions)\n'
              + '    const downloadOptions = {\n',
              'attempt setup',
          )
          installer = replace_once(
              installer,
              '      tempDirectory: attemptDirectory\n    }\n',
              '      tempDirectory: attemptDirectory,\n'
              + '      ...(mirrorOptions ? { mirrorOptions } : {})\n'
              + '    }\n',
              'attempt options',
          )

          helper_marker = '  return delays\n}\n\nfunction isTransientDownloadError(error) {\n'
          helper_block = '''  return delays
          }

          function parseElectronFallbackMirror(configured) {
            if (configured === undefined) {
              return undefined
            }
            if (configured.length === 0 || configured.length > MAX_FALLBACK_MIRROR_LENGTH) {
              throw new Error('ORCA_ELECTRON_PACKAGE_FALLBACK_MIRROR is invalid')
            }

            let mirror
            try {
              mirror = new URL(configured)
            } catch {
              throw new Error('ORCA_ELECTRON_PACKAGE_FALLBACK_MIRROR is invalid')
            }
            if (
              mirror.protocol !== 'https:' ||
              !mirror.hostname ||
              mirror.username ||
              mirror.password ||
              mirror.search ||
              mirror.hash ||
              !mirror.pathname.endsWith('/')
            ) {
              throw new Error('ORCA_ELECTRON_PACKAGE_FALLBACK_MIRROR is invalid')
            }
            return { mirror: mirror.toString(), customDir: '{{ version }}' }
          }

          function getAttemptMirrorOptions(attempt, fallbackMirrorOptions) {
            return fallbackMirrorOptions && attempt % 2 === 1 ? fallbackMirrorOptions : undefined
          }

          function isTransientDownloadError(error) {
          '''.replace('          ', '')
          installer = replace_once(installer, helper_marker, helper_block, 'mirror helpers')
          installer_path.write_text(installer, encoding='utf-8')

          action_path = Path('.github/actions/install-node-dependencies/action.yml')
          action = action_path.read_text(encoding='utf-8')
          action_marker = (
              "    - name: Install Electron package binary for Node-native tests\n"
              "      if: inputs.native-runtime == 'node'\n"
              "      shell: bash\n"
          )
          action = replace_once(
              action,
              action_marker,
              action_marker
              + '      env:\n'
              + "        # Mirror archives remain pinned by Electron's bundled checksums.\n"
              + '        ORCA_ELECTRON_PACKAGE_FALLBACK_MIRROR: https://repo.huaweicloud.com/electron/\n',
              'Electron action step',
          )
          action_path.write_text(action, encoding='utf-8')
          PY

      - name: Commit fallback implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            config/scripts/install-electron-package-binary.mjs \
            .github/actions/install-node-dependencies/action.yml
          git commit -m 'fix(ci): fall back to checksummed Electron mirror'
          git push origin HEAD:feat/multica-local-process-executor
