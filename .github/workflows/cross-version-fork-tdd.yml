name: Cross-version fork tag TDD

on:
  push:
    branches:
      - fix/cross-version-fork-tags

permissions:
  contents: read

jobs:
  focused-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
      - name: Run fork-aware cross-version contract
        run: >-
          pnpm exec vitest run --config config/vitest.config.ts
          tests/e2e/cross-version-wire/cross-version-terminal-wire.unit.test.ts
      - name: Run TypeScript checks
        run: pnpm typecheck
      - name: Enforce file size limits
        run: pnpm run check:max-lines-ratchet
