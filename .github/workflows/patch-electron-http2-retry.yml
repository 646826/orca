name: Patch Electron HTTP2 retry compatibility

on:
  push:
    branches:
      - feat/multica-local-process-executor

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/multica-local-process-executor
          fetch-depth: 0

      - name: Apply exact-context patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          script_path = Path('config/scripts/install-electron-package-binary.mjs')
          script = script_path.read_text(encoding='utf-8')
          old_import = "import { fileURLToPath } from 'node:url'\n"
          if script.count(old_import) != 1:
              raise SystemExit('node:url import changed')
          script = script.replace(old_import, '')
          old_direct = (
              "const isDirectExecution =\n"
              "  process.argv[1] !== undefined && resolve(process.argv[1]) === fileURLToPath(import.meta.url)"
          )
          new_direct = (
              "const isDirectExecution =\n"
              "  process.argv[1] !== undefined && resolve(process.argv[1]) === import.meta.filename"
          )
          if script.count(old_direct) != 1:
              raise SystemExit('direct execution guard changed')
          script = script.replace(old_direct, new_direct)
          marker = "  'EPIPE',\n  'ETIMEDOUT',"
          replacement = "  'EPIPE',\n  'ERR_HTTP2_STREAM_ERROR',\n  'ETIMEDOUT',"
          if script.count(marker) != 1:
              raise SystemExit('transient code list changed')
          script = script.replace(marker, replacement)
          script_path.write_text(script, encoding='utf-8')

          test_path = Path('config/scripts/install-electron-package-binary-resilience.test.mjs')
          test = test_path.read_text(encoding='utf-8')
          anchor = """  it('retries server errors exposed through a standard Fetch Response status', () => {\n"""
          if test.count(anchor) != 1:
              raise SystemExit('response status test anchor changed')
          new_test = """  it('retries refused HTTP/2 streams reported by Node', () => {\n    const projectDir = mkTempProject()\n\n    try {\n      writeFakeElectronPackage(projectDir)\n      writeFakeElectronGet(projectDir, {\n        downloadFailures: 1,\n        errorCode: 'ERR_HTTP2_STREAM_ERROR'\n      })\n      writeFakeExtractor(projectDir)\n\n      const result = runInstallScript(projectDir, {\n        ORCA_ELECTRON_PACKAGE_RETRY_DELAYS_MS: '0'\n      })\n\n      expect(result.status, result.stderr).toBe(0)\n      expect(readAttempts(projectDir)).toHaveLength(2)\n      expect(result.stderr).toContain(\n        'Transient Electron download failure (ERR_HTTP2_STREAM_ERROR)'\n      )\n    } finally {\n      rmSync(projectDir, { recursive: true, force: true })\n    }\n  })\n\n"""
          test = test.replace(anchor, new_test + anchor)
          old_signature = """  { downloadFailures, responseStatus = null }\n) {\n"""
          new_signature = """  { downloadFailures, responseStatus = null, errorCode = null }\n) {\n"""
          if test.count(old_signature) != 1:
              raise SystemExit('fake downloader signature changed')
          test = test.replace(old_signature, new_signature)
          old_failure = """  if (attempt <= ${JSON.stringify(downloadFailures)}) {\n    if (${JSON.stringify(responseStatus)} !== null) {\n"""
          new_failure = """  if (attempt <= ${JSON.stringify(downloadFailures)}) {\n    if (${JSON.stringify(errorCode)} !== null) {\n      const cause = Object.assign(new Error('stream refused'), {\n        code: ${JSON.stringify(errorCode)}\n      })\n      throw Object.assign(new TypeError('fetch failed'), { cause })\n    }\n    if (${JSON.stringify(responseStatus)} !== null) {\n"""
          if test.count(old_failure) != 1:
              raise SystemExit('fake downloader failure block changed')
          test = test.replace(old_failure, new_failure)
          test_path.write_text(test, encoding='utf-8')
          PY
          rm .github/workflows/patch-electron-http2-retry.yml
          git diff --check

      - name: Commit compatibility patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/scripts/install-electron-package-binary.mjs config/scripts/install-electron-package-binary-resilience.test.mjs .github/workflows/patch-electron-http2-retry.yml
          git commit -m 'fix(ci): retry refused Electron HTTP2 streams'
          git push origin HEAD:feat/multica-local-process-executor
