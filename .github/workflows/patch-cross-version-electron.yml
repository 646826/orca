name: Patch cross-version Electron bootstrap

on:
  push:
    branches:
      - feat/multica-local-process-executor
    paths:
      - .github/workflows/patch-cross-version-electron.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/multica-local-process-executor
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply exact-context patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/pr.yml')
          text = path.read_text(encoding='utf-8')
          job_start = text.index('  cross-version-wire:\n')
          job_end = text.index('\n  managed_hook_node18:', job_start)
          job = text[job_start:job_end]
          if 'Install Electron package binary for cross-version tests' in job:
              raise SystemExit('cross-version Electron bootstrap is already present')

          marker = '          native-runtime: node\n'
          marker_end = job.index(marker) + len(marker)
          install_step = (
              '\n'
              '      - name: Install Electron package binary for cross-version tests\n'
              '        run: node config/scripts/install-electron-package-binary.mjs\n'
          )
          patched_job = job[:marker_end] + install_step + job[marker_end:]
          path.write_text(text[:job_start] + patched_job + text[job_end:], encoding='utf-8')
          PY

      - name: Commit workflow fix
        shell: bash
        run: |
          if git diff --quiet -- .github/workflows/pr.yml; then
            echo 'No workflow change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/pr.yml
          git commit -m 'ci: bootstrap Electron before cross-version wire tests'
          git push origin HEAD:feat/multica-local-process-executor
