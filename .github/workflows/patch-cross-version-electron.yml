name: Patch cross-version Electron bootstrap

on:
  push:
    branches:
      - feat/multica-local-process-executor
    paths:
      - .github/workflows/patch-cross-version-electron.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/multica-local-process-executor
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply exact-context patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/pr.yml')
          text = path.read_text(encoding='utf-8')
          old = """      - uses: ./.github/actions/install-node-dependencies
                with:
                  native-runtime: node

              # A path filter that matches nothing exits 1 (\"No test files found\"), so this
              # lane cannot report success while running zero tests.
              - name: Old/new client and server terminal journey
          """.replace('              ', '')
          new = """      - uses: ./.github/actions/install-node-dependencies
                with:
                  native-runtime: node

              - name: Install Electron package binary for cross-version tests
                run: node config/scripts/install-electron-package-binary.mjs

              # A path filter that matches nothing exits 1 (\"No test files found\"), so this
              # lane cannot report success while running zero tests.
              - name: Old/new client and server terminal journey
          """.replace('              ', '')

          if old not in text:
              raise SystemExit('expected cross-version workflow context not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit workflow fix
        shell: bash
        run: |
          if git diff --quiet -- .github/workflows/pr.yml; then
            echo 'No workflow change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/pr.yml
          git commit -m 'ci: bootstrap Electron before cross-version wire tests'
          git push origin HEAD:feat/multica-local-process-executor
